<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Three-stop mystery city itinerary</title>
  <desc id="desc">A travel itinerary listing the Real Alcázar, the Giralda, and Plaza de España without naming the city.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8eb"/>
      <stop offset="1" stop-color="#eadac1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2e271f" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect x="32" y="32" width="1136" height="556" rx="18" fill="url(#paper)" stroke="#566a4a" stroke-width="5" filter="url(#shadow)"/>
  <rect x="32" y="32" width="1136" height="105" rx="15" fill="#566a4a"/>
  <text x="82" y="82" font-family="Georgia, serif" font-size="29" font-weight="700" fill="#fff7e9" letter-spacing="3">ADVENTURE AWAITS</text>
  <text x="82" y="114" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#f3c18c" letter-spacing="5">MYSTERY CITY · DAY ITINERARY</text>
  <text x="1082" y="103" text-anchor="end" font-family="Arial, sans-serif" font-size="58" fill="#f3c18c">✈</text>

  <path d="M215 214v269" stroke="#d7792f" stroke-width="5" stroke-dasharray="8 12"/>

  <g font-family="Arial, sans-serif">
    <circle cx="215" cy="236" r="29" fill="#d7792f"/>
    <text x="215" y="246" text-anchor="middle" font-size="28" font-weight="900" fill="#fff8eb">1</text>
    <text x="282" y="220" font-size="15" font-weight="800" fill="#657457" letter-spacing="3">09:00 · PALACE VISIT</text>
    <text x="282" y="265" font-family="Georgia, serif" font-size="41" font-weight="700" fill="#3d3329">REAL ALCÁZAR</text>

    <circle cx="215" cy="353" r="29" fill="#566a4a"/>
    <text x="215" y="363" text-anchor="middle" font-size="28" font-weight="900" fill="#fff8eb">2</text>
    <text x="282" y="337" font-size="15" font-weight="800" fill="#657457" letter-spacing="3">12:30 · TOWER STOP</text>
    <text x="282" y="382" font-family="Georgia, serif" font-size="41" font-weight="700" fill="#3d3329">THE GIRALDA</text>

    <circle cx="215" cy="470" r="29" fill="#d7792f"/>
    <text x="215" y="480" text-anchor="middle" font-size="28" font-weight="900" fill="#fff8eb">3</text>
    <text x="282" y="454" font-size="15" font-weight="800" fill="#657457" letter-spacing="3">16:00 · SUNSET WALK</text>
    <text x="282" y="499" font-family="Georgia, serif" font-size="41" font-weight="700" fill="#3d3329">PLAZA DE ESPAÑA</text>
  </g>

  <g transform="translate(855 198)">
    <rect x="0" y="0" width="235" height="292" rx="8" fill="#f8ecd8" stroke="#b99162" stroke-width="3"/>
    <path d="M35 220h165M54 220V92h127v128M74 92V55h87v37M99 55V28h37v27" fill="none" stroke="#566a4a" stroke-width="7"/>
    <path d="M25 236h185" stroke="#d7792f" stroke-width="9"/>
    <circle cx="117" cy="144" r="29" fill="none" stroke="#d7792f" stroke-width="6"/>
    <text x="117" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#566a4a" letter-spacing="2">THREE STOPS · ONE CITY</text>
  </g>

  <path d="M82 548h1025" stroke="#7c705f" stroke-width="2" stroke-dasharray="8 9"/>
  <text x="82" y="574" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#566a4a" letter-spacing="3">GATE C3 · NAME THE DESTINATION</text>
</svg>
