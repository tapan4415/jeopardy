<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Adventure Awaits boarding pass</title>
  <desc id="desc">A decorative boarding pass with destination airport code HND emphasized.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#efe1cc"/>
    </linearGradient>
    <pattern id="stripes" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="18" fill="#6a7c5d" opacity=".14"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#392f25" flood-opacity=".25"/>
    </filter>
  </defs>

  <rect x="30" y="30" width="1140" height="450" rx="22" fill="url(#paper)" stroke="#596c4d" stroke-width="5" filter="url(#shadow)"/>
  <rect x="30" y="30" width="86" height="450" rx="20" fill="url(#stripes)"/>
  <path d="M920 30v450" stroke="#7b6e5f" stroke-width="2" stroke-dasharray="10 10"/>

  <g fill="#596c4d">
    <text x="150" y="88" font-family="Georgia, serif" font-size="25" font-weight="700" letter-spacing="4">ADVENTURE AWAITS</text>
    <text x="150" y="124" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="5">BOARDING PASS · BABY JEOPARDY</text>
  </g>
  <g fill="#d8782d">
    <text x="820" y="106" font-family="Arial, sans-serif" font-size="58">✈</text>
  </g>

  <path d="M150 150h720" stroke="#8c806f" stroke-width="2" stroke-dasharray="7 8"/>

  <g font-family="Arial, sans-serif" fill="#596c4d" font-size="15" font-weight="700" letter-spacing="2">
    <text x="150" y="194">PASSENGER</text>
    <text x="420" y="194">FROM</text>
    <text x="650" y="194">DESTINATION AIRPORT</text>
  </g>
  <g font-family="Georgia, serif" fill="#3e3429">
    <text x="150" y="238" font-size="29" font-weight="700">VIP GUEST</text>
    <text x="420" y="238" font-size="34" font-weight="700">SJC</text>
  </g>

  <rect x="635" y="205" width="245" height="116" rx="10" fill="#596c4d"/>
  <text x="757.5" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="76" font-weight="900" letter-spacing="10" fill="#fff8eb">HND</text>

  <path d="M150 342h730" stroke="#8c806f" stroke-width="2" stroke-dasharray="7 8"/>
  <g font-family="Arial, sans-serif" fill="#596c4d" font-size="14" font-weight="700" letter-spacing="2">
    <text x="150" y="382">FLIGHT</text>
    <text x="330" y="382">GATE</text>
    <text x="500" y="382">SEAT</text>
    <text x="650" y="382">BOARDING GROUP</text>
  </g>
  <g font-family="Georgia, serif" fill="#3e3429" font-size="27" font-weight="700">
    <text x="150" y="426">BABY-080</text>
    <text x="330" y="426">C3</text>
    <text x="500" y="426">80</text>
    <text x="650" y="426">FIRST CLASS</text>
  </g>

  <g transform="translate(950 70)">
    <text x="90" y="0" text-anchor="middle" font-family="Arial, sans-serif" fill="#596c4d" font-size="14" font-weight="800" letter-spacing="2">DESTINATION</text>
    <text x="90" y="77" text-anchor="middle" font-family="Arial, sans-serif" fill="#d8782d" font-size="62" font-weight="900">HND</text>
    <path d="M15 108h150" stroke="#596c4d" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="90" y="150" text-anchor="middle" font-family="Georgia, serif" fill="#3e3429" font-size="17">Gate C3</text>
    <text x="90" y="179" text-anchor="middle" font-family="Georgia, serif" fill="#3e3429" font-size="17">Seat 80</text>
    <g transform="translate(28 215)" fill="#596c4d">
      <rect x="0" y="0" width="7" height="112"/>
      <rect x="13" y="0" width="3" height="112"/>
      <rect x="22" y="0" width="9" height="112"/>
      <rect x="38" y="0" width="4" height="112"/>
      <rect x="49" y="0" width="12" height="112"/>
      <rect x="68" y="0" width="5" height="112"/>
      <rect x="81" y="0" width="9" height="112"/>
      <rect x="98" y="0" width="3" height="112"/>
      <rect x="108" y="0" width="13" height="112"/>
    </g>
  </g>
</svg>
