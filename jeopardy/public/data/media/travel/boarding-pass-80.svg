<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Ultimate Frisbee League travel pass</title>
  <desc id="desc">A decorative UFL travel pass with destination airport code HND emphasized.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#d9e0e7"/>
    </linearGradient>
    <pattern id="stripes" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="18" fill="#0c263f" opacity=".16"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#392f25" flood-opacity=".25"/>
    </filter>
  </defs>

  <rect x="30" y="30" width="1140" height="450" rx="22" fill="url(#paper)" stroke="#0c263f" stroke-width="5" filter="url(#shadow)"/>
  <rect x="30" y="30" width="86" height="450" rx="20" fill="url(#stripes)"/>
  <path d="M920 30v450" stroke="#7b6e5f" stroke-width="2" stroke-dasharray="10 10"/>

  <g fill="#0c263f">
    <text x="150" y="88" font-family="Arial, sans-serif" font-size="25" font-weight="900" letter-spacing="4">ULTIMATE FRISBEE LEAGUE</text>
    <text x="150" y="124" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="5">NORTH PARK · TRAVEL PASS</text>
  </g>
  <g fill="#f58220">
    <text x="802" y="104" font-family="Arial, sans-serif" font-size="42" font-weight="900">UFL</text>
  </g>

  <path d="M150 150h720" stroke="#8c806f" stroke-width="2" stroke-dasharray="7 8"/>

  <g font-family="Arial, sans-serif" fill="#0c263f" font-size="15" font-weight="700" letter-spacing="2">
    <text x="150" y="194">PLAYER</text>
    <text x="420" y="194">FROM</text>
    <text x="650" y="194">DESTINATION AIRPORT</text>
  </g>
  <g font-family="Georgia, serif" fill="#0c2136">
    <text x="150" y="238" font-size="29" font-weight="700">UFL TEAM</text>
    <text x="420" y="238" font-size="34" font-weight="700">SJC</text>
  </g>

  <rect x="635" y="205" width="245" height="116" rx="10" fill="#0c263f"/>
  <text x="757.5" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="76" font-weight="900" letter-spacing="10" fill="#fff8eb">HND</text>

  <path d="M150 342h730" stroke="#8c806f" stroke-width="2" stroke-dasharray="7 8"/>
  <g font-family="Arial, sans-serif" fill="#0c263f" font-size="14" font-weight="700" letter-spacing="2">
    <text x="150" y="382">ROUND</text>
    <text x="330" y="382">FIELD</text>
    <text x="500" y="382">SEAT</text>
    <text x="650" y="382">DIVISION</text>
  </g>
  <g font-family="Georgia, serif" fill="#0c2136" font-size="27" font-weight="700">
    <text x="150" y="426">UFL-080</text>
    <text x="330" y="426">NP</text>
    <text x="500" y="426">80</text>
    <text x="650" y="426">MIXED</text>
  </g>

  <g transform="translate(950 70)">
    <text x="90" y="0" text-anchor="middle" font-family="Arial, sans-serif" fill="#0c263f" font-size="14" font-weight="800" letter-spacing="2">DESTINATION</text>
    <text x="90" y="77" text-anchor="middle" font-family="Arial, sans-serif" fill="#f58220" font-size="62" font-weight="900">HND</text>
    <path d="M15 108h150" stroke="#0c263f" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="90" y="150" text-anchor="middle" font-family="Georgia, serif" fill="#0c2136" font-size="17">Field NP</text>
    <text x="90" y="179" text-anchor="middle" font-family="Georgia, serif" fill="#0c2136" font-size="17">Clue 80</text>
    <g transform="translate(28 215)" fill="#0c263f">
      <rect x="0" y="0" width="7" height="112"/>
      <rect x="13" y="0" width="3" height="112"/>
      <rect x="22" y="0" width="9" height="112"/>
      <rect x="38" y="0" width="4" height="112"/>
      <rect x="49" y="0" width="12" height="112"/>
      <rect x="68" y="0" width="5" height="112"/>
      <rect x="81" y="0" width="9" height="112"/>
      <rect x="98" y="0" width="3" height="112"/>
      <rect x="108" y="0" width="13" height="112"/>
    </g>
  </g>
</svg>
