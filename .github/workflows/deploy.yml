name: Deploy to GitHub Pages

on:
  push:
    branches: ['varunih/baseCode']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: jeopardy/package-lock.json

      - name: Install dependencies
        working-directory: jeopardy
        run: npm ci

      - name: Build
        working-directory: jeopardy
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: jeopardy/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Ensure GitHub Pages enabled (or create it)
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check whether Pages is enabled for the repo
          status=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token $TOKEN" https://api.github.com/repos/$REPO/pages)
          if [ "$status" -eq 404 ]; then
            echo "GitHub Pages is not enabled for $REPO. Attempting to create a Pages site using the repository default branch."
            default_branch=$(curl -s -H "Authorization: token $TOKEN" https://api.github.com/repos/$REPO | python -c "import sys,json;print(json.load(sys.stdin)['default_branch'])")
            echo "Default branch: $default_branch"
            create_status=$(curl -s -o /dev/null -w "%{http_code}" -X PUT -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
              -d "{\"source\":{\"branch\":\"$default_branch\",\"path\":\"/\"}}" https://api.github.com/repos/$REPO/pages)
            if [ "$create_status" -ne 201 ] && [ "$create_status" -ne 204 ]; then
              echo "::error::Failed to create GitHub Pages site (HTTP $create_status). Please enable Pages at https://github.com/$REPO/settings/pages or grant the workflow permission to administer Pages."
              exit 1
            fi
            echo "GitHub Pages site created successfully."
          else
            echo "GitHub Pages already enabled (HTTP $status)."
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
